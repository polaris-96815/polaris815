<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Polaris</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet"/>
  <style>
    body {
      margin: 0;
      background: radial-gradient(ellipse at bottom, #0d1b2a 0%, #000000 100%);
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      color: white;
    }

    .stars {
      width: 100%;
      height: 100%;
      background: transparent url('https://raw.githubusercontent.com/JulianLaval/canvas-stars/master/stars.jpg') repeat;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
      animation: moveStars 100s linear infinite;
    }

    @keyframes moveStars {
      from { background-position: 0 0; }
      to { background-position: 10000px 10000px; }
    }

    .title {
      position: absolute;
      top: 40px;
      width: 100%;
      text-align: center;
      font-size: 2.5rem;
      font-weight: 600;
      z-index: 2;
      letter-spacing: 2px;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100vh;
      z-index: 1;
    }

    .star {
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      position: absolute;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 5px #fff;
    }

    .star.active {
      background: gold;
      box-shadow: 0 0 10px gold;
    }

    .message {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
      text-align: center;
      display: none;
      z-index: 2;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <canvas id="linesCanvas"></canvas>

  <div class="title">Polaris</div>

  <div class="container" id="container"></div>
  <div class="message" id="message">
    🎉 모든 너구리를 다 찾으셨습니다!<br/>
    칵테일 바에서 선물을 수령해주세요!
  </div>

  <script>
    const container = document.getElementById('container');
    const message = document.getElementById('message');

    // 사자자리 별자리 좌표 (중앙 정렬)
    const stars = [
      { x: 500, y: 200 }, // Regulus
      { x: 540, y: 160 },
      { x: 580, y: 180 },
      { x: 620, y: 220 },
      { x: 660, y: 260 }, // Denebola
      { x: 540, y: 240 },
      { x: 500, y: 280 },
      { x: 460, y: 260 },
      { x: 480, y: 220 }
    ];

    let activeCount = 0;

    stars.forEach((star, i) => {
      const div = document.createElement('div');
      div.classList.add('star');
      div.style.left = `${star.x}px`;
      div.style.top = `${star.y}px`;
      div.dataset.index = i;
      div.addEventListener('click', () => {
        if (!div.classList.contains('active')) {
          div.classList.add('active');
          activeCount++;
          if (activeCount === stars.length) {
            message.style.display = 'block';
          }
        }
      });
      container.appendChild(div);
    });

    // 선 연결
    const canvas = document.getElementById('linesCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1.5;

    ctx.beginPath();
    ctx.moveTo(stars[0].x + 10, stars[0].y + 10);
    for (let i = 1; i < stars.length; i++) {
      ctx.lineTo(stars[i].x + 10, stars[i].y + 10);
    }
    ctx.stroke();
  </script>
</body>
</html>
